# Overrides only; defaults come from buildUponDefaultConfig.
style:
  # Codec and sim are byte offsets and protocol constants; naming each one hides the layout.
  MagicNumber:
    active: false
  # ktfmt owns line length.
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  # Previews are called by the IDE, not the code.
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  # Needs type resolution, so only the typed tasks (detektMain, wired into check) report it.
  ForbiddenMethodCall:
    active: true
    methods:
      - value: 'kotlin.runCatching'
        reason: 'catches CancellationException, so a cancelled coroutine runs on; use attempt (protocol/.../Attempt.kt)'
complexity:
  # Link, device and sim are single state machines on purpose (AGENTS.md: unlocked state, one scope).
  TooManyFunctions:
    active: false
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
